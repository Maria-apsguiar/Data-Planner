<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha de Estudos & Planner: Análise de Dados</title>
  <style>
    /* ==========================================================================
       VARIABLES & BASE STYLES
       ========================================================================== */
    :root {
      --bg-primary: #0f172a;
      --bg-card: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --progress-color: #3b82f6;
      --warning: #f59e0b;
      --fire: #ef4444;
      --radius: 12px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container { max-width: 900px; margin: 0 auto; }

    header { margin-bottom: 2rem; text-align: center; }

    h1 {
      font-size: 2.25rem; font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .subtitle { color: var(--text-muted); font-size: 1rem; }

    /* STREAK & STATS HEADER */
    .header-stats {
      display: flex; justify-content: center; align-items: center; gap: 1.5rem;
      margin-top: 1rem; flex-wrap: wrap;
    }

    .streak-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5; padding: 0.4rem 1rem; border-radius: 999px;
      font-weight: 700; font-size: 0.95rem;
    }

    .progress-container {
      background: var(--bg-card); padding: 1.25rem;
      border-radius: var(--radius); border: 1px solid var(--border); margin-top: 1.5rem;
    }

    .progress-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
    .progress-bar-bg { height: 10px; background: var(--bg-primary); border-radius: 999px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--progress-color), var(--success)); transition: width 0.4s ease; }

    /* WIDGETS SECTION (AGENDA + TIMER & HISTÓRICO) */
    .widgets-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem;
    }
    @media (max-width: 768px) { .widgets-grid { grid-template-columns: 1fr; } }

    .widget-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem;
    }

    .widget-title {
      font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem;
      display: flex; align-items: center; justify-content: space-between;
    }

    /* CONTADOR DE TEMPO STYLES */
    .pomo-select-container { margin-bottom: 0.6rem; }
    .pomo-select {
      width: 100%; background: var(--bg-primary); border: 1px solid var(--border);
      color: var(--text-main); padding: 0.4rem 0.6rem; border-radius: 6px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
    }
    .pomo-select:focus { border-color: var(--accent); outline: none; }

    .pomo-display {
      font-size: 2.2rem; font-weight: 800; text-align: center;
      font-family: monospace; color: var(--accent); margin: 0.2rem 0 0.5rem 0;
    }
    .pomo-controls { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; }

    /* HISTÓRICO SEMANAL GRID RESPONSIVO */
    .weekly-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.35rem;
      margin-top: 1rem; padding-top: 0.75rem; border-top: 1px dashed var(--border);
      overflow-x: auto; padding-bottom: 0.2rem;
    }
    .weekly-grid::-webkit-scrollbar { height: 4px; }
    .weekly-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .day-card {
      background: var(--bg-primary); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.4rem 0.2rem; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
      min-width: 42px; transition: var(--transition);
    }
    .day-card.today { border-color: var(--accent); background: rgba(99, 102, 241, 0.08); }
    .day-name { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .day-date { font-size: 0.65rem; color: var(--text-muted); opacity: 0.8; }
    .day-icon { font-size: 0.9rem; margin: 0.1rem 0; }
    .day-time { font-size: 0.65rem; font-weight: 600; font-family: monospace; color: var(--text-main); }

    /* AGENDA STYLES */
    .agenda-date-picker {
      background: var(--bg-primary); border: 1px solid var(--border);
      color: var(--text-main); padding: 0.3rem 0.6rem; border-radius: 6px;
      font-size: 0.85rem;
    }

    .agenda-items { display: flex; flex-direction: column; gap: 0.75rem; max-height: 240px; overflow-y: auto; padding-right: 2px; }
    
    .agenda-item {
      display: flex; flex-direction: column; gap: 0.4rem;
      background: var(--bg-primary); padding: 0.8rem; border-radius: 8px;
      font-size: 0.9rem; border: 1px solid var(--border);
      transition: var(--transition);
    }

    .agenda-item-header {
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    }

    .agenda-item.checked { border-color: var(--success); background: rgba(16, 185, 129, 0.05); }
    .agenda-item.checked .agenda-title { text-decoration: line-through; color: var(--text-muted); }

    .agenda-title { font-weight: 600; font-size: 0.92rem; }

    .agenda-course-time {
      font-size: 0.78rem; font-weight: 600; color: #60a5fa;
      background: rgba(59, 130, 246, 0.1); padding: 0.25rem 0.5rem;
      border-radius: 4px; display: inline-flex; align-items: center; gap: 0.3rem;
      width: fit-content; margin-top: 0.1rem;
    }

    .agenda-checkbox-label {
      display: flex; align-items: center; gap: 0.5rem; cursor: pointer;
      font-weight: 600; font-size: 0.85rem; color: var(--accent);
      background: rgba(99, 102, 241, 0.1); padding: 0.3rem 0.6rem; border-radius: 6px;
      transition: var(--transition); user-select: none;
    }
    .agenda-checkbox-label:hover { background: var(--accent); color: #fff; }

    .agenda-checkbox {
      width: 18px; height: 18px; accent-color: var(--success); cursor: pointer;
    }

    .agenda-canvas-note {
      font-size: 0.78rem; color: #fde047; background: rgba(245, 158, 11, 0.1);
      border-left: 3px solid var(--warning); padding: 0.4rem 0.6rem; border-radius: 4px;
      line-height: 1.35; margin-top: 0.2rem;
    }

    /* TOOLBAR & FILTERS */
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      margin: 1.5rem 0; flex-wrap: wrap; gap: 1rem;
      background: var(--bg-card); padding: 1rem; border-radius: var(--radius); border: 1px solid var(--border);
    }

    .search-box {
      background: var(--bg-primary); border: 1px solid var(--border);
      color: var(--text-main); padding: 0.5rem 0.8rem; border-radius: 6px;
      width: 100%; max-width: 250px; font-size: 0.85rem;
    }

    .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .btn {
      background: var(--border); color: var(--text-main); border: none;
      padding: 0.5rem 0.8rem; border-radius: 6px; cursor: pointer;
      font-size: 0.85rem; font-weight: 600; transition: var(--transition);
    }
    .btn:hover { background: var(--accent); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); }
    .btn.active { background: var(--accent); color: #fff; }

    .category-title { font-size: 1.25rem; margin: 2rem 0 1rem 0; color: #cbd5e1; border-left: 4px solid var(--accent); padding-left: 0.5rem; }

    /* COURSE CARD & NOTES (COM HOVER UX ELEVATION) */
    .course-list { display: flex; flex-direction: column; gap: 1rem; }
    .course-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.25rem; display: flex; flex-direction: column; gap: 0.8rem;
      transition: var(--transition);
    }
    .course-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.25);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .course-card-main { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }

    .course-card.in_progress { border-color: rgba(59, 130, 246, 0.4); background: rgba(59, 130, 246, 0.02); }
    .course-card.completed { border-color: rgba(16, 185, 129, 0.4); background: rgba(16, 185, 129, 0.02); }
    .course-card.completed .course-title-text { text-decoration: line-through; color: var(--text-muted); }

    .course-info { display: flex; gap: 1rem; flex: 1; }

    .status-btn {
      width: 26px; height: 26px; border-radius: 6px; border: 2px solid var(--border);
      background: var(--bg-primary); cursor: pointer; flex-shrink: 0; margin-top: 2px;
      display: flex; align-items: center; justify-content: center; transition: var(--transition);
    }
    .status-btn:hover { border-color: var(--accent); transform: scale(1.1); }
    
    .status-btn.in_progress { border-color: var(--progress-color); background: rgba(59, 130, 246, 0.2); }
    .status-btn.in_progress::after { content: "⏳"; font-size: 12px; }

    .status-btn.completed { border-color: var(--success); background: var(--success); }
    .status-btn.completed::after { content: "✓"; color: #fff; font-weight: bold; font-size: 14px; }

    .badge { padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; background: var(--border); font-weight: 600; }
    .badge.pending { background: var(--border); color: var(--text-muted); }
    .badge.in_progress { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .badge.completed { background: rgba(16, 185, 129, 0.2); color: var(--success); }

    .links-group { display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-end; }

    .btn-link {
      color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.85rem;
      padding: 0.4rem 0.75rem; border-radius: 6px; background: rgba(99, 102, 241, 0.1); white-space: nowrap;
      transition: var(--transition); text-align: center;
    }
    .btn-link:hover { background: var(--accent); color: #fff; }
    .btn-link.alt-link { color: var(--warning); background: rgba(245, 158, 11, 0.1); }
    .btn-link.alt-link:hover { background: var(--warning); color: #000; }
    .btn-link.restricted { color: var(--text-muted); background: rgba(148, 163, 184, 0.1); pointer-events: none; opacity: 0.8; }

    /* EXPANDABLE NOTES */
    .notes-toggle {
      background: transparent; border: none; color: var(--text-muted); font-size: 0.8rem;
      cursor: pointer; display: inline-flex; align-items: center; gap: 0.3rem; margin-top: 0.2rem;
    }
    .notes-toggle:hover { color: var(--text-main); }

    .notes-container { display: none; margin-top: 0.5rem; }
    .notes-container.open { display: block; }
    .notes-textarea {
      width: 100%; background: var(--bg-primary); border: 1px solid var(--border);
      color: var(--text-main); padding: 0.6rem; border-radius: 6px; font-size: 0.85rem;
      resize: vertical; min-height: 60px;
    }

    /* RESTRICTED NOTE BOX */
    .restricted-note {
      font-size: 0.8rem; color: #fde047; background: rgba(245, 158, 11, 0.08);
      border-left: 3px solid var(--warning); padding: 0.4rem 0.6rem; border-radius: 4px;
      margin-top: 0.4rem; line-height: 1.4;
    }

    /* TOAST MOTIVACIONAL */
    .toast-container {
      position: fixed; bottom: 20px; right: 20px; z-index: 9999;
      display: flex; flex-direction: column; gap: 10px; pointer-events: none;
    }

    .toast {
      background: linear-gradient(135deg, #4f46e5, #059669);
      color: white; padding: 1rem 1.25rem; border-radius: var(--radius);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); font-weight: 600; font-size: 0.9rem;
      max-width: 350px; animation: slideIn 0.3s ease, fadeOut 0.5s ease 4.5s forwards;
      pointer-events: auto;
    }

    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

    @media (max-width: 640px) {
      .course-card-main { flex-direction: column; }
      .links-group { align-items: stretch; width: 100%; margin-top: 0.5rem; }
      .btn-link { text-align: center; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Análise de Dados: Trilha de Estudos</h1>
      <p class="subtitle">Planejador diário e acompanhamento de cursos complementares.</p>
      
      <div class="header-stats">
        <div class="streak-badge">
          🔥 <span id="streak-count">0</span> Dias Seguidos de Estudo
        </div>
      </div>

      <div class="progress-container">
        <div class="progress-header">
          <span>Progresso Geral</span>
          <span id="progress-text">0 de 0 concluídos (0%)</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
      </div>
    </header>

    <!-- WIDGETS: AGENDA + CONTADOR DE TEMPO & HISTÓRICO -->
    <div class="widgets-grid">
      <!-- WIDGET AGENDA -->
      <div class="widget-card">
        <div class="widget-title">
          <span>📅 Agenda Diária</span>
          <input type="date" id="agenda-date" class="agenda-date-picker" min="2026-07-26" max="2026-10-31">
        </div>

        <div id="agenda-items-container" class="agenda-items">
          <!-- Cursos em andamento para a data aparecerão aqui -->
        </div>
      </div>

      <!-- WIDGET CONTADOR DE TEMPO + HISTÓRICO SEMANAL -->
      <div class="widget-card">
        <div class="widget-title">
          <span>⏱️ Registro de Horas de Estudo</span>
          <span id="pomo-mode-label" style="font-size: 0.8rem; color: var(--text-muted);">Acumulado Hoje</span>
        </div>

        <!-- SELETOR DE CURSO VINCULADO AO TEMPORIZADOR -->
        <div class="pomo-select-container">
          <select id="pomo-course-select" class="pomo-select" onchange="onCourseSelectChange()">
            <option value="">🎯 Estudo Geral (Sem curso específico)</option>
          </select>
        </div>

        <div class="pomo-display" id="pomo-timer">00:00:00</div>
        <div class="pomo-controls">
          <button class="btn" onclick="startTimer()">▶ Play</button>
          <button class="btn btn-outline" onclick="pauseTimer()">⏸ Pause</button>
          <button class="btn btn-outline" onclick="stopTimer()">⏹ Finalizar Dia</button>
        </div>
        <p id="summary-msg" style="margin-top: 6px; font-weight: 600; font-size: 0.8rem; color: var(--success); text-align: center; min-height: 18px;"></p>

        <!-- GRADE DO HISTÓRICO DOS ÚLTIMOS 7 DIAS -->
        <div class="weekly-grid" id="weekly-grid">
          <!-- Os 7 cards diários serão gerados via JavaScript -->
        </div>
      </div>
    </div>

    <!-- BARRA DE FERRAMENTAS -->
    <div class="toolbar">
      <input type="text" id="search-input" class="search-box" placeholder="🔍 Pesquisar curso ou assunto..." oninput="render()">

      <div class="btn-group">
        <button class="btn active" id="filter-all" onclick="setFilter('all')">Todos</button>
        <button class="btn btn-outline" id="filter-pending" onclick="setFilter('pending')">Pendentes</button>
        <button class="btn btn-outline" id="filter-in_progress" onclick="setFilter('in_progress')">Em andamento</button>
        <button class="btn btn-outline" id="filter-completed" onclick="setFilter('completed')">Concluídos</button>
      </div>

      <div class="btn-group">
        <button class="btn btn-outline" onclick="exportProgress()">📥 Exportar</button>
        <button class="btn btn-outline" onclick="document.getElementById('import-file').click()">📤 Importar</button>
        <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importProgress(event)">
        <button class="btn" onclick="addNewCourse()">+ Criar Novo</button>
      </div>
    </div>

    <main id="main-content"></main>
  </div>

  <div class="toast-container" id="toast-container"></div>

    function getLocalDateString(d = new Date()) {
      const year = d.getFullYear();

    function getStoredData() {
      const storedCourses = localStorage.getItem('data_analytics_courses_v7');
      const storedAgenda = localStorage.getItem('data_analytics_agenda_v7');
      
      let courses = initialCourses;
      if (storedCourses) {
        const parsed = JSON.parse(storedCourses);
        courses = initialCourses.map(course => {
          const match = parsed.find(p => p.id === course.id);
          return match ? { ...course, status: match.status || course.status, notes: match.notes || '' } : course;
        });
      }

      if (storedAgenda) {
        agendaLog = JSON.parse(storedAgenda);
      }

      return courses;
    }

    let courses = getStoredData();

    function save() {
      localStorage.setItem('data_analytics_courses_v7', JSON.stringify(courses));
      localStorage.setItem('data_analytics_agenda_v7', JSON.stringify(agendaLog));
      calculateStreak();
      render();
      renderAgenda();
      populateTimerCourseSelect();
    }

    function triggerMotivationalToast() {
      const randomQuote = motivationalQuotes[Math.floor(Math.random() * motivationalQuotes.length)];
      const toastContainer = document.getElementById('toast-container');
      
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = "✨ " + randomQuote;
      
      toastContainer.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
    }

    function cycleCourseStatus(id) {
      courses = courses.map(c => {
        if (c.id === id) {
          let nextStatus = 'pending';
          if (c.status === 'pending') nextStatus = 'in_progress';
          else if (c.status === 'in_progress') nextStatus = 'completed';
          else if (c.status === 'completed') nextStatus = 'pending';

          if (nextStatus === 'completed' || nextStatus === 'in_progress') {
            triggerMotivationalToast();
          }
          return { ...c, status: nextStatus };
        }
        return c;
      });
      save();
    }

    function updateNotes(id, text) {
      courses = courses.map(c => c.id === id ? { ...c, notes: text } : c);
      localStorage.setItem('data_analytics_courses_v7', JSON.stringify(courses));
    }

    const agendaDatePicker = document.getElementById('agenda-date');
    const todayLocal = getLocalDateString();
    
    agendaDatePicker.value = todayLocal;
    agendaDatePicker.addEventListener('change', renderAgenda);

    function toggleAgendaCheck(courseId) {
      const selectedDate = agendaDatePicker.value;
      if (!agendaLog[selectedDate]) agendaLog[selectedDate] = [];

      const index = agendaLog[selectedDate].indexOf(courseId);
      if (index > -1) {
        agendaLog[selectedDate].splice(index, 1);
      } else {
        agendaLog[selectedDate].push(courseId);
        triggerMotivationalToast();
      }

      save();
    }

    function getCourseTimeForDate(courseId, dateStr) {
      const key = `data_planner_course_timer_${dateStr}_${courseId}`;
      const savedSecs = localStorage.getItem(key);
      let secs = savedSecs ? parseInt(savedSecs, 10) : 0;

      if (timerInterval !== null && activeCourseId === courseId && dateStr === getLocalDateString()) {
        const currentSessionSecs = Math.floor((Date.now() - sessionStartTimestamp) / 1000);
        secs += currentSessionSecs;
      }
      return secs;
    }

    function renderAgenda() {
      const selectedDate = agendaDatePicker.value;
      const container = document.getElementById('agenda-items-container');
      container.innerHTML = '';

      const activeCourses = courses.filter(c => c.status === 'in_progress');

      if (activeCourses.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-top: 1rem;">Nenhum item "Em andamento" no momento. Marque um item na lista para acompanhar aqui!</p>`;
        return;
      }

      const completedToday = agendaLog[selectedDate] || [];

      activeCourses.forEach(course => {
        const isChecked = completedToday.includes(course.id);
        const courseSecs = getCourseTimeForDate(course.id, selectedDate);
        const courseTimeFormatted = formatShortTime(courseSecs);

        const item = document.createElement('div');
        item.className = `agenda-item ${isChecked ? 'checked' : ''}`;
        
        const canvasNoteHtml = course.id === 'generation-canvas' ? `
          <div class="agenda-canvas-note">
            ⚠️ Confirme se já deu check no Canvas nas aulas síncronas e realizou todas as atividades instruídas pelos professores antes de marcar.
          </div>
        ` : '';

        item.innerHTML = `
          <div class="agenda-item-header">
            <span class="agenda-title">${course.title}</span>
            <label class="agenda-checkbox-label">
              <input type="checkbox" class="agenda-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleAgendaCheck('${course.id}')">
              <span>${isChecked ? 'Concluído' : 'Check-in'}</span>
            </label>
          </div>
          <div class="agenda-course-time">
            ⏱️ Tempo estudado hoje: <strong>${courseTimeFormatted}</strong>
          </div>
          ${canvasNoteHtml}
        `;
        container.appendChild(item);
      });
    }

    function calculateStreak() {
      const dates = Object.keys(agendaLog).filter(d => agendaLog[d] && agendaLog[d].length > 0).sort();
      let streak = dates.length > 0 ? dates.length : 0;
      document.getElementById('streak-count').textContent = streak;
    }

    // ==========================================================================
    // CONTADOR DE TEMPO PERSISTENTE (GERAL + POR CURSO)
    // ==========================================================================
    let timerInterval = null;
    let sessionStartTimestamp = null;
    let savedDaySeconds = 0;
    let savedCourseSeconds = 0;
    let activeCourseId = "";
    const originalTitle = "Trilha de Estudos & Planner: Análise de Dados";

    function getStorageKey(dateStr = getLocalDateString()) {
      return `data_planner_timer_${dateStr}`;
    }

    function getCourseStorageKey(courseId, dateStr = getLocalDateString()) {
      return `data_planner_course_timer_${dateStr}_${courseId}`;
    }

    function populateTimerCourseSelect() {
      const select = document.getElementById('pomo-course-select');
      if (!select) return;

      const selectedValue = select.value;
      select.innerHTML = '<option value="">🎯 Estudo Geral (Sem curso específico)</option>';

      const activeCourses = courses.filter(c => c.status === 'in_progress');
      activeCourses.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = `📚 ${c.title}`;
        select.appendChild(opt);
      });

      select.value = selectedValue;
    }

    function onCourseSelectChange() {
      if (timerInterval !== null) {
        saveCurrentSession();
        sessionStartTimestamp = Date.now();
      }
      activeCourseId = document.getElementById('pomo-course-select').value;
      loadSavedTimer();
    }

    function loadSavedTimer() {
      const key = getStorageKey();
      const savedSecs = localStorage.getItem(key);
      savedDaySeconds = savedSecs ? parseInt(savedSecs, 10) : 0;

      activeCourseId = document.getElementById('pomo-course-select').value;
      if (activeCourseId) {
        const cKey = getCourseStorageKey(activeCourseId);
        const cSecs = localStorage.getItem(cKey);
        savedCourseSeconds = cSecs ? parseInt(cSecs, 10) : 0;
      } else {
        savedCourseSeconds = 0;
      }

      updateTimerDisplay();
    }

    function formatTime(totalSeconds) {
      const hrs = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
      const mins = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
      const secs = (totalSeconds % 60).toString().padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }

    function formatShortTime(totalSeconds) {
      if (!totalSeconds || totalSeconds <= 0) return "00:00h";
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      if (hrs > 0) return `${hrs}h${mins > 0 ? ' ' + mins + 'm' : ''}`;
      return `${mins}m`;
    }

    function getCurrentTotalSeconds() {
      if (sessionStartTimestamp !== null) {
        const currentSessionSecs = Math.floor((Date.now() - sessionStartTimestamp) / 1000);
        return savedDaySeconds + currentSessionSecs;
      }
      return savedDaySeconds;
    }

    function saveCurrentSession() {
      if (sessionStartTimestamp !== null) {
        const sessionSecs = Math.floor((Date.now() - sessionStartTimestamp) / 1000);
        
        savedDaySeconds += sessionSecs;
        localStorage.setItem(getStorageKey(), savedDaySeconds.toString());

        if (activeCourseId) {
          savedCourseSeconds += sessionSecs;
          localStorage.setItem(getCourseStorageKey(activeCourseId), savedCourseSeconds.toString());
        }
      }
    }

    function updateTimerDisplay() {
      const totalSecs = getCurrentTotalSeconds();
      const formatted = formatTime(totalSecs);
      document.getElementById('pomo-timer').textContent = formatted;
      
      if (timerInterval !== null) {
        document.title = `⏱️ ${formatted} - Planner`;
      } else if (totalSecs > 0) {
        document.title = `⏸️ ${formatted} (Pausado)`;
      } else {
        document.title = originalTitle;
      }

      renderWeeklyGrid();
      renderAgenda();
    }

    function startTimer() {
      if (timerInterval !== null) return;
      document.getElementById('summary-msg').textContent = "";
      
      activeCourseId = document.getElementById('pomo-course-select').value;
      sessionStartTimestamp = Date.now();

      timerInterval = setInterval(() => {
        updateTimerDisplay();
      }, 500);
      
      updateTimerDisplay();
    }

    function pauseTimer() {
      if (timerInterval !== null) {
        clearInterval(timerInterval);
        timerInterval = null;
        
        saveCurrentSession();
        sessionStartTimestamp = null;
        
        updateTimerDisplay();
      }
    }

    function stopTimer() {
      const totalSecs = getCurrentTotalSeconds();
      
      if (totalSecs > 0) {
        const confirmStop = confirm("Deseja encerrar a sessão de estudos de hoje?");
        if (!confirmStop) return;
      }

      if (timerInterval !== null) {
        clearInterval(timerInterval);
        timerInterval = null;
      }

      saveCurrentSession();
      sessionStartTimestamp = null;

      if (totalSecs > 0) {
        const totalFormatted = formatTime(savedDaySeconds);
        let courseMsg = "";
        
        if (activeCourseId) {
          const course = courses.find(c => c.id === activeCourseId);
          const cSecs = localStorage.getItem(getCourseStorageKey(activeCourseId));
          const cFormatted = formatShortTime(cSecs ? parseInt(cSecs, 10) : 0);
          courseMsg = ` (${cFormatted} no curso "${course ? course.title : ''}")`;
        }

        document.getElementById('summary-msg').textContent = `🎉 Parabéns! Você acumulou ${totalFormatted} de estudos hoje${courseMsg}!`;
        triggerMotivationalToast();
      }
      
      updateTimerDisplay();
    }

    // ==========================================================================
    // RENDERIZADOR DO GRID DOS ÚLTIMOS 7 DIAS
    // ==========================================================================
    function renderWeeklyGrid() {
      const gridContainer = document.getElementById('weekly-grid');
      if (!gridContainer) return;

      gridContainer.innerHTML = '';
      const dayNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
      const todayDate = new Date();

      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(todayDate.getDate() - i);

        const dateStr = getLocalDateString(d);
        const dayLabel = dayNames[d.getDay()];
        const dayNum = String(d.getDate()).padStart(2, '0');
        const isToday = (i === 0);

        let secs = 0;
        if (isToday) {
          secs = getCurrentTotalSeconds();
        } else {
          const storedSecs = localStorage.getItem(getStorageKey(dateStr));
          secs = storedSecs ? parseInt(storedSecs, 10) : 0;
        }

        let icon = "⚪";
        if (secs >= 3600) {
          icon = "🔥";
        } else if (secs > 0) {
          icon = "✅";
        }

        const card = document.createElement('div');
        card.className = `day-card ${isToday ? 'today' : ''}`;
        card.title = `${dateStr} - Total: ${formatTime(secs)}`;

        card.innerHTML = `
          <span class="day-name">${isToday ? 'Hoje' : dayLabel}</span>
          <span class="day-date">${dayNum}</span>
          <span class="day-icon">${icon}</span>
          <span class="day-time">${formatShortTime(secs)}</span>
        `;

        gridContainer.appendChild(card);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && timerInterval !== null) {
        updateTimerDisplay();
      }
    });

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.toolbar .btn-group .btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`filter-${filter}`).classList.add('active');
      render();

    function exportProgress() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ courses, agendaLog }));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "meu_progresso_completo.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importProgress(event) {
      const fileReader = new FileReader();
      fileReader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.courses) courses = imported.courses;
          if (imported.agendaLog) agendaLog = imported.agendaLog;
          save();
          alert("Progresso importado com sucesso!");
        } catch (err) {
          alert("Erro ao importar dados.");
        }
      };
      fileReader.readAsText(event.target.files[0]);
    }

    function addNewCourse() {
      const title = prompt("Nome do curso ou aula:");
      const url = prompt("Link (URL):");
      if (title && url) {
        courses.push({
          id: "custom_" + Date.now(),
          category: "Adicionados por Você",
          title: title,
          provider: "Link Personalizado",
          description: "Adicionado manualmente",
          url: url,
          status: "pending",
          notes: ""
        });
        save();
      }
    }

    function render() {
      const main = document.getElementById('main-content');
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      main.innerHTML = '';

      const total = courses.length;
      const completedCount = courses.filter(c => c.status === 'completed').length;
      const inProgressCount = courses.filter(c => c.status === 'in_progress').length;
      const pct = total ? Math.round((completedCount / total) * 100) : 0;

      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('progress-text').textContent = 
        `${completedCount} concluídos (${pct}%) • ${inProgressCount} em andamento de ${total} totais`;

      const filtered = courses.filter(c => {
        const matchesFilter = (currentFilter === 'all') || (c.status === currentFilter);
        const matchesSearch = c.title.toLowerCase().includes(searchQuery) || c.provider.toLowerCase().includes(searchQuery);
        return matchesFilter && matchesSearch;
      });

      const categories = [...new Set(courses.map(c => c.category))];

      categories.forEach(cat => {
        const catCourses = filtered.filter(c => c.category === cat);
        if (catCourses.length === 0) return;

        const catHeader = document.createElement('h2');
        catHeader.className = 'category-title';
        catHeader.textContent = cat;
        main.appendChild(catHeader);

        const list = document.createElement('div');
        list.className = 'course-list';

        catCourses.forEach(course => {
          const card = document.createElement('div');
          card.className = `course-card ${course.status}`;

          let linkHtml = '';
          if (course.isRestricted) {
            linkHtml = `<span class="btn-link restricted">🔒 Acesso Restrito</span>`;
          } else {
            const labelText = course.btnLabel || 'Acessar ↗';
            const altLinkHtml = course.altUrl ? `
              <a href="${course.altUrl}" target="_blank" class="btn-link alt-link">${course.altUrlLabel || 'Link Alternativo ↗'}</a>
            ` : '';
            linkHtml = `
              <a href="${course.url}" target="_blank" class="btn-link">${labelText}</a>
              ${altLinkHtml}
            `;
          }

          const restrictedNoteHtml = course.isRestricted ? `
            <div class="restricted-note">
              ℹ️ ${course.restrictedMsg}
            </div>
          ` : '';

          card.innerHTML = `
            <div class="course-card-main">
              <div class="course-info">
                <button class="status-btn ${course.status}" onclick="cycleCourseStatus('${course.id}')" title="Clique para alterar status"></button>
                <div style="flex: 1;">
                  <h3>
                    <span class="course-title-text">${course.title}</span>
                    <span class="badge ${course.status}">${course.status === 'completed' ? 'Concluído' : course.status === 'in_progress' ? 'Em andamento' : 'Pendente'}</span>
                  </h3>
                  <p><strong>${course.provider}</strong> ${course.description ? '— ' + course.description.replace(/\n/g, '<br>') : ''}</p>
                  ${restrictedNoteHtml}
                  <button class="notes-toggle" onclick="toggleNotesVisibility('${course.id}')">📝 Anotações Rápidas</button>
                </div>
              </div>
              <div class="links-group">
                ${linkHtml}
              </div>
            </div>

            <div class="notes-container" id="notes-container-${course.id}">
              <textarea 
                class="notes-textarea" 
                placeholder="Escreva aqui suas anotações, comandos ou dúvidas sobre este item..." 
                onchange="updateNotes('${course.id}', this.value)">${course.notes || ''}</textarea>
            </div>
          `;
          list.appendChild(card);
        });

        main.appendChild(list);
      });
    }

    // Initial Load
    calculateStreak();
    render();
    populateTimerCourseSelect();
    renderAgenda();
    loadSavedTimer();
  </script>
</body>
</html>
